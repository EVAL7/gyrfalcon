[workspace]
resolver = "2"
members = [
    "crates/gyrfalcon-parser",
    "crates/gyrfalcon-index",
    "crates/gyrfalcon-mcp",
]

[workspace.package]
version = "0.1.15"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Aleksandr Gradoboev"]
repository = "https://github.com/aleksandrgradoboev-svg/gyrfalcon"

[workspace.dependencies]
gyrfalcon-parser = { path = "crates/gyrfalcon-parser", version = "0.1.0" }
gyrfalcon-index  = { path = "crates/gyrfalcon-index",  version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rayon = "1"
regex = "1"
walkdir = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
crossbeam-channel = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }

# Слежение за файловой системой (веха 7): подписка вместо обхода.
# Обход дерева ЕРП.УХ стоит 10 с — платить это каждым ответом нельзя,
# а раз в сессию мало: правка в середине сессии обычное дело.
notify = "8"

# Разбор XML выгрузки (веха 3). Потоковый: файлы метаданных бывают
# в десятки мегабайт, а нужны из них единицы полей.
quick-xml = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Сборка индекса упирается в разбор тысяч модулей. Отладочная сборка
# без оптимизации зависимостей делает замеры бессмысленными.
[profile.dev.package."*"]
opt-level = 2
